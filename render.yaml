services:
  - type: web
    name: llm-chatbot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    disk:
      name: app-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LLM_API_KEYS
        sync: false   # Set in Render dashboard – do NOT commit real keys
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: CACHE_DIR
        value: /data/llm_cache
      - key: ALLOWED_ORIGINS
        sync: false   # Set to your frontend URL e.g. https://your-app.vercel.app
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: LLM_MODEL
        value: gemini/gemini-2.0-flash
      - key: DEFAULT_SYSTEM_PROMPT
        value: "You are a helpful assistant."
      - key: PORT
        value: "8000"
      - key: LITELLM_LOCAL_MODEL_COST_MAP
        value: "1"
    healthCheckPath: /health

  - type: web
    name: llm-chatbot-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # Set to your backend URL e.g. https://llm-chatbot-backend.onrender.com
