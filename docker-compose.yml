services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: llm-chatbot-backend
    container_name: llm-chatbot-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/app.db}
      - CACHE_DIR=${CACHE_DIR:-/data/llm_cache}
      - LITELLM_LOCAL_MODEL_COST_MAP=1
    volumes:
      - app_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    image: llm-chatbot-frontend
    container_name: llm-chatbot-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  app_data:
    driver: local
